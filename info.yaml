# Tiny Tapeout project information
project:
  title:        "16-bit RISC Protocol Emulator"      # Project title
  author:       "Jyotiraditya Satpathy"      # Your name
  discord:      "MotaBablu"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "I/O co-processor for cycle accurate protocol emulation"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000      # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "8x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_pio_core"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_pio_core.sv"
    - "core_pkg.sv"
    - "asic_top.sv"
    - "core_top.sv"
    - "alu.sv"
    - "decoder.sv"
    - "RM_IHPSG13_2P_1024x16_c2_bm_bist.v"
    - "dp_sram.sv"
    - "fifo.sv"
    - "reg_file.sv"
    - "smu.sv"
    - "spi.sv"
    - "timing_controller.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "SPI_SCK"
  ui[1]: "SPI_MOSI"
  ui[2]: "SPI_CS_n"
  ui[3]: "PAD_IN[8]"
  ui[4]: "PAD_IN[9]"
  ui[5]: "PAD_IN[10]"
  ui[6]: "PAD_IN[11]"
  ui[7]: "PAD_IN[12]"

  # Outputs
  uo[0]: "SPI_MISO"
  uo[1]: "PAD_OUT[8]"
  uo[2]: "PAD_OUT[9]"
  uo[3]: "PAD_OUT[10]"
  uo[4]: "PAD_OUT[11]"
  uo[5]: "PAD_OUT[12]"
  uo[6]: "PAD_OUT[13]"
  uo[7]: "PAD_OUT[14]"

  # Bidirectional pins
  uio[0]: "PAD[0]"
  uio[1]: "PAD[1]"
  uio[2]: "PAD[2]"
  uio[3]: "PAD[3]"
  uio[4]: "PAD[4]"
  uio[5]: "PAD[5]"
  uio[6]: "PAD[6]"
  uio[7]: "PAD[7]"

# Do not change!
yaml_version: 6
